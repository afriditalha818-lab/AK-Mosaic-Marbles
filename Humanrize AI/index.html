<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HumaniQ AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f7fb;
  color:#111827;
  min-height:100vh;
}

.container{
  width:min(1200px,94%);
  margin:auto;
  padding:30px 0;
}

header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:25px;
}

.logo-area{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:48px;
  height:48px;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  color:white;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:23px;
  font-weight:bold;
}

h1{
  font-size:26px;
}

.subtitle{
  color:#6b7280;
  font-size:13px;
  margin-top:4px;
}

button{
  border:none;
  cursor:pointer;
  border-radius:10px;
  padding:12px 17px;
  font-weight:bold;
  transition:.2s;
}

button:hover{
  transform:translateY(-1px);
}

.primary{
  background:#2563eb;
  color:white;
}

.primary:hover{
  background:#1d4ed8;
}

.secondary{
  background:#e9eef6;
  color:#111827;
}

.danger{
  background:#fee2e2;
  color:#b91c1c;
}

.card{
  background:white;
  border:1px solid #e5e7eb;
  border-radius:18px;
  padding:20px;
  box-shadow:0 10px 35px rgba(0,0,0,.05);
}

.settings{
  margin-bottom:20px;
}

.hidden{
  display:none;
}

label{
  display:block;
  font-weight:bold;
  font-size:14px;
  margin-bottom:8px;
}

input[type="password"],
input[type="file"]{
  width:100%;
  border:1px solid #d1d5db;
  border-radius:10px;
  padding:12px;
  outline:none;
  background:white;
}

input:focus,
textarea:focus{
  border-color:#2563eb;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
}

textarea{
  width:100%;
  height:360px;
  resize:vertical;
  border:1px solid #d1d5db;
  border-radius:13px;
  padding:15px;
  font-size:15px;
  line-height:1.6;
  outline:none;
}

.actions{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  margin-top:12px;
}

.status{
  color:#6b7280;
  font-size:13px;
  margin-top:10px;
  min-height:18px;
}

.counter{
  text-align:right;
  color:#9ca3af;
  font-size:12px;
  margin-top:5px;
}

.upload-card{
  grid-column:1/-1;
}

.info{
  color:#6b7280;
  font-size:13px;
  margin-top:8px;
  line-height:1.5;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr;
  }

  .upload-card{
    grid-column:auto;
  }

  header{
    align-items:flex-start;
    gap:15px;
  }

  h1{
    font-size:22px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <div class="logo-area">
    <div class="logo">H</div>
    <div>
      <h1>HumaniQ AI</h1>
      <div class="subtitle">
        AI Writing & Image-to-Text Assistant
      </div>
    </div>
  </div>

  <button class="secondary" onclick="toggleSettings()">
    ⚙ API Settings
  </button>
</header>


<!-- API SETTINGS -->

<div id="settings" class="card settings hidden">

  <label>Gemini API Key</label>

  <input
    id="apiKey"
    type="password"
    placeholder="Paste your Gemini API key"
  >

  <p class="info">
    Your API key is stored only in this browser's localStorage.
    For a public production website, use a backend server instead.
  </p>

  <div class="actions">

    <button class="primary" onclick="saveApiKey()">
      Save API Key
    </button>

    <button class="danger" onclick="removeApiKey()">
      Remove Key
    </button>

  </div>

</div>


<div class="grid">


<!-- INPUT -->

<div class="card">

  <label>Original Text</label>

  <textarea
    id="inputText"
    placeholder="Paste your text here..."
  ></textarea>

  <div class="counter">
    <span id="charCount">0</span> characters
  </div>

  <div class="actions">

    <button class="primary" onclick="humanizeText()">
      ✨ Humanize
    </button>

    <button class="secondary" onclick="clearAll()">
      Clear
    </button>

  </div>

  <div id="textStatus" class="status"></div>

</div>


<!-- OUTPUT -->

<div class="card">

  <label>Humanized Result</label>

  <textarea
    id="outputText"
    placeholder="Your result will appear here..."
    readonly
  ></textarea>

  <div class="actions">

    <button class="secondary" onclick="copyResult()">
      📋 Copy
    </button>

    <button class="secondary" onclick="downloadResult()">
      ⬇ Download
    </button>

  </div>

  <div id="copyStatus" class="status"></div>

</div>


<!-- IMAGE -->

<div class="card upload-card">

  <label>Image → Text</label>

  <input
    id="imageInput"
    type="file"
    accept="image/*"
  >

  <p class="info">
    Upload an image containing text. HumaniQ AI will extract the text
    using Gemini AI.
  </p>

  <div class="actions">

    <button class="primary" onclick="extractImageText()">
      🖼 Extract Text
    </button>

  </div>

  <div id="imageStatus" class="status"></div>

</div>

</div>

</div>


<script>

/* =========================================
   HUMANIQ AI
   GEMINI API
========================================= */

const API_STORAGE_KEY = "humaniq_gemini_api_key";

const inputText = document.getElementById("inputText");
const outputText = document.getElementById("outputText");
const charCount = document.getElementById("charCount");

inputText.addEventListener("input", function(){

  charCount.textContent = inputText.value.length;

});


/* =========================================
   SETTINGS
========================================= */

function toggleSettings(){

  document
    .getElementById("settings")
    .classList.toggle("hidden");

  const savedKey =
    localStorage.getItem(API_STORAGE_KEY);

  if(savedKey){

    document.getElementById("apiKey").value =
      savedKey;

  }

}


function saveApiKey(){

  const key =
    document.getElementById("apiKey").value.trim();

  if(!key){

    alert("Please enter your Gemini API key.");

    return;

  }

  localStorage.setItem(
    API_STORAGE_KEY,
    key
  );

  alert("API key saved successfully.");

}


function removeApiKey(){

  localStorage.removeItem(API_STORAGE_KEY);

  document.getElementById("apiKey").value = "";

  alert("API key removed.");

}


function getApiKey(){

  return localStorage.getItem(
    API_STORAGE_KEY
  );

}


/* =========================================
   GEMINI API
========================================= */

async function callGemini(parts){

  const apiKey = getApiKey();

  if(!apiKey){

    throw new Error(
      "Please add your Gemini API key from API Settings."
    );

  }


const model = "gemini-3.8-flash";


  const url =
    "https://generativelanguage.googleapis.com/v1beta/models/"
    + model
    + ":generateContent?key="
    + encodeURIComponent(apiKey);


  const response =
    await fetch(url, {

      method:"POST",

      headers:{
        "Content-Type":
        "application/json"
      },

      body:JSON.stringify({

        contents:[
          {
            parts:parts
          }
        ]

      })

    });


  const data =
    await response.json();


  if(!response.ok){

    throw new Error(
      data?.error?.message ||
      "Gemini API request failed."
    );

  }


  const partsResult =
    data?.candidates?.[0]?.content?.parts || [];


  return partsResult
    .map(part => part.text || "")
    .join("")
    .trim();

}


/* =========================================
   HUMANIZE
========================================= */

async function humanizeText(){

  const text =
    inputText.value.trim();


  if(!text){

    alert("Please enter some text first.");

    return;

  }


  const status =
    document.getElementById("textStatus");


  status.textContent =
    "✨ HumaniQ AI is processing...";


  outputText.value = "";


  const prompt = `
You are HumaniQ AI, a professional writing assistant.

Rewrite the following text so it sounds natural,
clear, fluent and human-written.

Rules:

- Keep the original meaning.
- Do not invent facts.
- Do not remove important information.
- Improve grammar.
- Improve readability.
- Use natural sentence structure.
- Avoid unnecessary complicated words.
- Keep approximately the same length.
- Keep the original tone where possible.
- Return ONLY the rewritten text.

TEXT:

${text}
`;


  try{

    const result =
      await callGemini([
        {
          text:prompt
        }
      ]);


    outputText.value =
      result;


    status.textContent =
      "✅ Humanization completed.";

  }

  catch(error){

    status.textContent =
      "❌ " + error.message;

  }

}


/* =========================================
   IMAGE TO TEXT
========================================= */

async function extractImageText(){

  const file =
    document.getElementById(
      "imageInput"
    ).files[0];


  if(!file){

    alert("Please select an image first.");

    return;

  }


  if(file.size > 8 * 1024 * 1024){

    alert(
      "Please choose an image smaller than 8 MB."
    );

    return;

  }


  const status =
    document.getElementById(
      "imageStatus"
    );


  status.textContent =
    "🖼 Reading image...";


  try{

    const base64 =
      await convertImageToBase64(file);


    const prompt = `
Extract all readable text from this image.

Rules:

- Extract the text accurately.
- Preserve the original wording.
- Preserve paragraphs where possible.
- Do not explain anything.
- Return only the extracted text.
`;


    const result =
      await callGemini([

        {
          text:prompt
        },

        {
          inlineData:{
            mimeType:
              file.type || "image/jpeg",

            data:base64
          }
        }

      ]);


    inputText.value =
      result;


    charCount.textContent =
      result.length;


    status.textContent =
      "✅ Text extracted successfully. Now click Humanize.";

  }

  catch(error){

    status.textContent =
      "❌ " + error.message;

  }

}


/* =========================================
   IMAGE CONVERTER
========================================= */

function convertImageToBase64(file){

  return new Promise(
    (resolve,reject)=>{

      const reader =
        new FileReader();


      reader.onload =
        function(){

          const result =
            reader.result;


          const base64 =
            result.split(",")[1];


          resolve(base64);

        };


      reader.onerror =
        function(){

          reject(
            new Error(
              "Could not read image."
            )
          );

        };


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================
   COPY
========================================= */

async function copyResult(){

  const text =
    outputText.value.trim();


  if(!text){

    alert("There is no result to copy.");

    return;

  }


  try{

    await navigator.clipboard.writeText(text);

    document.getElementById(
      "copyStatus"
    ).textContent =
      "✅ Copied to clipboard.";

  }

  catch{

    alert(
      "Copy failed. Please copy manually."
    );

  }

}


/* =========================================
   DOWNLOAD
========================================= */

function downloadResult(){

  const text =
    outputText.value.trim();


  if(!text){

    alert("There is no result to download.");

    return;

  }


  const blob =
    new Blob(
      [text],
      {
        type:
        "text/plain;charset=utf-8"
      }
    );


  const url =
    URL.createObjectURL(blob);


  const link =
    document.createElement("a");


  link.href = url;

  link.download =
    "HumaniQ-AI-Result.txt";


  document.body.appendChild(link);

  link.click();

  link.remove();


  URL.revokeObjectURL(url);

}


/* =========================================
   CLEAR
========================================= */

function clearAll(){

  inputText.value = "";

  outputText.value = "";

  charCount.textContent = "0";

  document.getElementById(
    "textStatus"
  ).textContent = "";

  document.getElementById(
    "copyStatus"
  ).textContent = "";

}


/* =========================================
   CHECK SAVED KEY
========================================= */

window.addEventListener(
  "load",
  function(){

    const key =
      localStorage.getItem(
        API_STORAGE_KEY
      );


    if(key){

      document.getElementById(
        "apiKey"
      ).value = key;

    }

  }
);

</script>

</body>
</html>
